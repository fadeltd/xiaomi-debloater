name: Release

# Merging to main does not publish directly. It derives the next version from
# the [Unreleased] section of CHANGELOG.md, rewrites the changelog, wails.json
# and the AppStream metainfo, commits that back to main, pushes a tag and opens
# a draft GitHub release. Publish then builds the tag and ships it.
#
# A merge with an empty [Unreleased] releases nothing, so merging and releasing
# stay separate decisions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Cut a release from the changelog
    runs-on: ubuntu-latest
    # Never react to our own release commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the BRANCH TIP, not the commit that triggered the run.
          # On a re-run the triggering sha is stale, and committing on top of it
          # produces a non-fast-forward push that is rejected. Combined with the
          # changelog logic being idempotent (an empty [Unreleased] releases
          # nothing) this makes a re-run safe rather than broken.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - id: cut
        name: Derive the version from CHANGELOG.md
        run: go run ./scripts/release

      - name: Commit the changelog and tag
        if: steps.cut.outputs.released == 'true'
        env:
          TAG: ${{ steps.cut.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="CHANGELOG.md wails.json packaging/linux/io.github.fadeltd.XiaomiDebloater.metainfo.xml"

          # Each push is guarded, so a partially-completed earlier attempt can
          # be resumed rather than blocking every retry.
          if git diff --quiet -- $files; then
            echo "::notice::Changelog and version already committed."
          else
            git add $files
            # [skip ci] so this push cannot re-enter this workflow when a PAT
            # is in use: with a PAT, pushes DO trigger workflows.
            git commit -m "Release ${TAG} [skip ci]"
            git push origin HEAD:main
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} already exists on the remote."
          else
            git tag -a "${TAG}" -m "${TAG}"
            git push origin "${TAG}"
          fi

      # The notes go through env, never through ${{ }} in the script. Expression
      # substitution pastes the text into the script BEFORE bash parses it, so
      # every backtick in the changelog would run as a command.
      #
      # A draft, because the assets do not exist yet. Publish uploads them and
      # then makes the release public, so nobody sees a release with no files.
      - name: Create the draft GitHub release
        if: steps.cut.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cut.outputs.tag }}
          NOTES: ${{ steps.cut.outputs.notes }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "$NOTES" \
            || echo "::notice::Release already exists."

      # Always dispatch, never rely on the tag event. Whether a tag pushed by
      # automation triggers `on: push: tags` depends on which credential pushed
      # it, and a publish that silently does not happen looks exactly like one
      # that succeeded.
      - name: Start Publish
        if: steps.cut.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref main -f tag="${{ steps.cut.outputs.tag }}"

      - name: Summary
        run: |
          if [ "${{ steps.cut.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.cut.outputs.tag }}; Publish started." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No [Unreleased] entries: nothing released." >> "$GITHUB_STEP_SUMMARY"
          fi
