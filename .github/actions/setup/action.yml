name: Set up the build toolchain
description: Go, Node.js with pnpm, the frontend dependencies and the Wails CLI.

inputs:
  linux-deps:
    description: Install the GTK and WebKitGTK headers that Linux builds link against.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - uses: pnpm/action-setup@v6
      with:
        version: 11

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install Linux build dependencies
      if: inputs.linux-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

    # Fails loudly if the lockfile has drifted.
    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile

    # The CLI version follows the library version in go.mod, so they never drift.
    - name: Install the Wails CLI
      shell: bash
      run: |
        version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
        go install "github.com/wailsapp/wails/v2/cmd/wails@${version}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
