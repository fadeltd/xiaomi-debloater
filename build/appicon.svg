<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA24C"/>
      <stop offset="1" stop-color="#F0501E"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F3A"/>
      <stop offset="1" stop-color="#1B1F27"/>
    </linearGradient>
  </defs>

  <!-- Background tile on the macOS 824px icon grid -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- Phone -->
  <rect x="260" y="196" width="376" height="632" rx="70" fill="#FFFFFF"/>
  <rect x="284" y="222" width="328" height="580" rx="50" fill="url(#screen)"/>

  <!-- App grid: remaining apps -->
  <g fill="#FF8A3D">
    <rect x="320" y="286" width="72" height="72" rx="20"/>
    <rect x="504" y="286" width="72" height="72" rx="20" fill="#FFB067"/>
    <rect x="412" y="386" width="72" height="72" rx="20" fill="#FFB067"/>
    <rect x="320" y="486" width="72" height="72" rx="20" fill="#FFB067"/>
    <rect x="504" y="486" width="72" height="72" rx="20"/>
    <rect x="412" y="586" width="72" height="72" rx="20"/>
  </g>

  <!-- App grid: cleared slots -->
  <g fill="none" stroke="#5B6474" stroke-width="6" stroke-dasharray="14 10">
    <rect x="415" y="289" width="66" height="66" rx="18"/>
    <rect x="323" y="389" width="66" height="66" rx="18"/>
    <rect x="415" y="489" width="66" height="66" rx="18"/>
    <rect x="323" y="589" width="66" height="66" rx="18"/>
    <rect x="507" y="589" width="66" height="66" rx="18"/>
    <rect x="507" y="389" width="66" height="66" rx="18"/>
  </g>

  <!-- Home indicator -->
  <rect x="404" y="748" width="88" height="10" rx="5" fill="#5B6474"/>

  <!-- App being removed: flicked out past the phone edge -->
  <g transform="translate(748 372) rotate(16)">
    <rect x="-78" y="-78" width="156" height="156" rx="40" fill="#FFFFFF"/>
    <rect x="-44" y="-11" width="88" height="22" rx="11" fill="#F0501E"/>
  </g>

  <!-- Motion marks -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.85">
    <line x1="664" y1="514" x2="712" y2="488"/>
    <line x1="676" y1="560" x2="744" y2="524"/>
  </g>
</svg>
